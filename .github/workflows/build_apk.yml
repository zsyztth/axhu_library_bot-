name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libstdc++6 pkg-config autoconf \
            libtool libffi-dev libssl-dev \
            openjdk-17-jdk-headless zip unzip ccache \
            python3-dev cmake ninja-build

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython

      - name: Display Buildozer version
        run: buildozer --version

      - name: Build debug APK
        run: |
          buildozer android debug 2>&1 | tee build_log.txt

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libraryseat-debug-apk
          path: |
            bin/*.apk
            *.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          retention-days: 7
