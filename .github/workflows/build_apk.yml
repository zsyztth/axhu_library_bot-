name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tushuguan/**']

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libstdc++6 pkg-config autoconf \
            libtool libffi-dev libssl-dev \
            openjdk-17-jdk-headless zip unzip ccache \
            python3-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install Buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Display Buildozer version
        run: buildozer --version

      - name: Build debug APK
        working-directory: tushuguan
        run: |
          buildozer android debug 2>&1 | tee build_log.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: libraryseat-debug-apk
          path: |
            tushuguan/bin/*.apk
            tushuguan/*.apk
          retention-days: 30

      - name: Release (optional)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            tushuguan/bin/*.apk
            tushuguan/*.apk
